<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Missing Painting</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="game.html">Play the Game</a>
                </li>

                <li>
                    <a href="about.html">About the Creator</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <header>
            <h1 id="scene-title">
                Bedroom at Sunset
            </h1>

            <h2 id="character-name">
                Narrator
            </h2>
        </header>

        <section>
            <img
                id="scene-image"
                src="images/1.0.png"
                alt="A bedroom at sunset."
            >

            <p id="scene-text">
                The story is loading.
            </p>
        </section>

        <section>
            <h2>Choices</h2>

            <div id="choices-container">
            </div>
        </section>

        <section>
            <h2>Player Information</h2>

            <p>Current Courage:</p>

            <ul>
                <li id="health-display">
                    20
                </li>
            </ul>

            <p>Inventory:</p>

            <ul>
                <li id="inventory-display">
                    Empty
                </li>
            </ul>

            <p id="message-display">
            </p>
        </section>

    </main>

    <footer>
        <p>
            Created by Zizhen Wu
        </p>
    </footer>

</body>
</html>
